spring:
  application:
    name: regor-backend
  datasource:
    url: ${REGOR_DB_URL:jdbc:postgresql://localhost:5432/regor}
    username: ${REGOR_DB_USERNAME}
    password: ${REGOR_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
regor:
  jwt:
    secret: ${REGOR_JWT_SECRET}
server:
  port: ${REGOR_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
