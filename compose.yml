services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: regor
      POSTGRES_USER: regor
      POSTGRES_PASSWORD: ${REGOR_DB_PASSWORD:?Defina REGOR_DB_PASSWORD}
    ports:
      - "127.0.0.1:${REGOR_DB_PORT:-5433}:5432"
    volumes:
      - regor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regor -d regor"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  regor_postgres:
